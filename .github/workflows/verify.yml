name: Quantum-group verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned numerical dependencies
        run: python -m pip install -r requirements-figures.txt
      - name: Test repository infrastructure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/verification
          python -m unittest discover -s tests -v 2>&1 | tee build/verification/infrastructure.log
      - name: Run all 24 original scientific groups and preserve evidence
        run: python tools/verify.py --output build/verification
      - name: Check complementary analytical identities
        run: python tools/check_foundations.py --output build/verification/foundations.json
      - name: Reproduce explanatory figures and check maintained assets
        run: python tools/generate_figures.py --check --output build/verification/figures
      - name: Check unchanged tracked source
        run: git diff --exit-code
      - name: Upload exact-revision reports and source hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quantum-group-verification-${{ github.run_id }}
          path: build/verification/
          if-no-files-found: error
          retention-days: 90

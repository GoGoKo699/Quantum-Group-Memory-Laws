name: One-time reviewed research import
on:
  push:
    branches: [initialize/qg-memory-laws]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'GoGoKo699/Quantum-Group-Memory-Laws' && github.ref == 'refs/heads/initialize/qg-memory-laws'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Import only the hash-verified source into the feature branch
        run: python .bootstrap/import.py
